name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs
      - run: |
          test -f dist/index.html
          test -f dist/book/index.html
          test -f dist/sitemap.xml
          test -f dist/legal/terms/index.html
          test -f dist/legal/privacy/index.html
          test -f dist/agents/index.html
          test -f dist/.well-known/mcp-registry-auth
          test -f dist/terms/index.html
          test -f dist/privacy/index.html
          grep -q 'ava@frostrivercapital.com' dist/index.html
          grep -q 'ava@frostrivercapital.com' dist/legal/terms/index.html
          grep -q 'ava@frostrivercapital.com' dist/legal/privacy/index.html
          grep -q 'ava@frostrivercapital.com' dist/contact/index.html
          grep -q '"email":"ava@frostrivercapital.com"' dist/index.html
          grep -q 'first-party hit collector' dist/legal/privacy/index.html
          grep -q 'missed-call callbacks' dist/legal/terms/index.html
          grep -q 'missed-call callbacks' dist/legal/privacy/index.html
          grep -q 'Google Business Profile' dist/legal/terms/index.html
          grep -q 'Google Business Profile' dist/legal/privacy/index.html
          grep -q 'Reply STOP to opt out, HELP for help' dist/legal/terms/index.html
          grep -q 'Reply STOP to opt out, HELP for help' dist/legal/privacy/index.html
          grep -q 'Consent is not a condition of purchase' dist/legal/terms/index.html
          grep -q 'Consent is not a condition of purchase' dist/legal/privacy/index.html
          grep -q '(866) 494-6590 and/or (720) 605-3198' dist/legal/terms/index.html
          grep -q '(866) 494-6590 and/or (720) 605-3198' dist/legal/privacy/index.html
          grep -q 'primary business phone' dist/legal/terms/index.html
          grep -q 'primary business phone' dist/legal/privacy/index.html
          grep -q 'https://bouldercountydryervent.com/legal/privacy/' dist/legal/terms/index.html
          grep -q 'https://bouldercountydryervent.com/legal/terms/' dist/legal/privacy/index.html
          grep -q '"telephone":"+1-866-494-6590"' dist/index.html
          grep -q '"phone":"(866) 494-6590"' dist/index.html
          ! grep -q '720' dist/index.html
          ! grep -q '"telephone":"+1-720-605-3198"' dist/legal/terms/index.html
          ! grep -q '"telephone":"+1-720-605-3198"' dist/legal/privacy/index.html
          grep -q 'missed-call callbacks' dist/book/index.html
          grep -q 'Consent is not a condition of purchase' dist/book/index.html
          grep -q 'Reply STOP to opt out, HELP for help' dist/book/index.html
          grep -q '__bcdvTrack' dist/js/site.js
          grep -q 'https://api.bouldercountydryervent.com/book' dist/index.html
          grep -q 'https://api.bouldercountydryervent.com/hit' dist/index.html
          grep -q 'https://api.bouldercountydryervent.com/mcp' dist/agents/index.html
          grep -q 'Book via agent' dist/index.html
          grep -q 'href="/agents/"' dist/index.html
          grep -q 'list_services' dist/agents/index.html
          grep -q 'create_booking' dist/agents/index.html
          grep -q 'X-BCDV-Agent-Token' dist/agents/index.html
          ! grep -Eiw 'ai' dist/agents/index.html
          ! grep -A30 'class="nav-desktop"' dist/index.html | grep -q 'Book via agent'
          printf '%s\n' 'v=MCPv1; k=ed25519; p=XQ9XIAiU0BBzsbSphCUSev+V3nn7fn+ySwRvsUrZPCY=' | cmp - dist/.well-known/mcp-registry-auth
          ! grep -q 'serious-climate-notification-introductory.trycloudflare.com' dist/index.html
          ! grep -q 'keeps-pty-ultimately-payroll.trycloudflare.com' dist/index.html
          ! grep -q 'exact-segments-mentioned-previously.trycloudflare.com' dist/index.html
          ! grep -q 'trycloudflare.com' dist/index.html
          ! grep -q 'trycloudflare.com' dist/agents/index.html
          ! grep -qi 'open the email again' dist/book/index.html
          ! grep -q 'data-done-mailto' dist/book/index.html
          grep -q 'We’ll confirm a 2-hour window in 1 business day' dist/book/index.html
          grep -q '3–4 business days out is typical right now. Holding a time costs nothing.' dist/book/index.html
          grep -q 'Continue — request my visit' dist/book/index.html
          grep -q 'Next you’ll pick days that work — holding a time costs nothing.' dist/book/index.html
          ! grep -q 'Request a time' dist/book/index.html
          grep -q 'Request my visit' dist/book/index.html
          grep -q 'Prefer to talk?' dist/book/index.html
          grep -q 'Book at $129' dist/index.html
          grep -q 'Book My Visit · $129' dist/index.html
          grep -q 'Standard clean, published' dist/index.html
          grep -q '"price":"129"' dist/index.html
          grep -q '"price":"169"' dist/index.html
          grep -q '"priceRange":"$129–$169"' dist/index.html
          grep -q '"standard":129' dist/index.html
          grep -q '"name":"Standard clean"' dist/index.html
          grep -q '<b data-price>$129</b>' dist/book/index.html
          grep -q '"standard":129' dist/book/index.html
          grep -q '$129 standard' dist/areas/louisville-co/index.html
          ! grep -q 'launch-banner' dist/index.html
          ! grep -qi 'launch special' dist/index.html
          ! grep -qi 'launch special' dist/book/index.html
          ! grep -qi 'launch special' dist/areas/louisville-co/index.html
          ! grep -q 'launchSpecialThrough' dist/index.html
          ! grep -q 'launchSpecialThrough' dist/book/index.html
          ! grep -q 'standardNormally' dist/index.html
          ! grep -q 'standardNormally' dist/book/index.html
          ! grep -q 'priceValidUntil' dist/index.html
          ! grep -q 'Normally $129' dist/index.html
          ! grep -q 'Normally $129' dist/book/index.html
          ! grep -q '$99' dist/index.html
          ! grep -q '$99' dist/book/index.html
          ! grep -q '$99' dist/areas/louisville-co/index.html
          ! grep -q '$99' dist/pricing/index.html
          ! grep -q '"price":"99"' dist/index.html
          grep -q 'tel:+18664946590' dist/book/index.html
          ! grep -q 'Send my request' dist/book/index.html
          ! grep -q 'info@frostrivercapital.com' dist/index.html
          ! grep -q 'info@frostrivercapital.com' dist/legal/terms/index.html
          ! grep -q 'info@frostrivercapital.com' dist/contact/index.html
          ! grep -q 'ava@bouldercountydryervent.com' dist/index.html
          ! grep -q 'ava@bouldercountydryervent.com' dist/legal/terms/index.html
          ! grep -q 'ava@bouldercountydryervent.com' dist/contact/index.html
          ! grep -q 'rob@frostrivercapital.com' dist/index.html
          ! grep -q 'rob@frostrivercapital.com' dist/legal/terms/index.html
          ! grep -q 'rob@frostrivercapital.com' dist/contact/index.html
