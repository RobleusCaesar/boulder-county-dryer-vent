# One-shot helper: the cloud token cannot call workflow_dispatch, and a
# GITHUB_TOKEN with actions:write can. Removed after the probe run exists.
name: Dispatch uptime probe once

on:
  push:
    branches:
      - cursor/outside-uptime-probe-b1fa
    paths:
      - .github/workflows/dispatch-uptime-probe-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch uptime probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/dispatch-body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/RobleusCaesar/boulder-county-dryer-vent/actions/workflows/uptime-probe.yml/dispatches \
            -d '{"ref":"cursor/outside-uptime-probe-b1fa"}')
          echo "dispatch HTTP ${code}"
          if [[ "$code" != "204" ]]; then
            sed -E 's/(ghs_|gho_|ghp_|github_pat_)[A-Za-z0-9_]+/[redacted]/g' /tmp/dispatch-body
            exit 1
          fi
