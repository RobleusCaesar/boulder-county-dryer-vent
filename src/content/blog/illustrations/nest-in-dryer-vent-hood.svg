<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <title>A side-wall dryer hood with the flap held open by twigs, lint in the duct, and a mouse in the wall</title>
  <rect width="1280" height="720" fill="#F6F1EA"/>
  <rect x="0" y="0" width="430" height="720" fill="#F3EFE8"/>
  <rect x="430" y="0" width="250" height="720" fill="#E6DDD2"/>
  <rect x="680" y="0" width="600" height="720" fill="#E7EEF2"/>

  <!-- Interior floor and exterior grade -->
  <rect x="0" y="560" width="430" height="160" fill="#E7E0D6"/>
  <rect x="680" y="560" width="600" height="160" fill="#D5DDD4"/>
  <path d="M680 560 C760 548 820 572 900 556 C980 540 1040 568 1120 552 C1180 542 1230 556 1280 548 L1280 620 L680 620 Z" fill="#FBF9F6"/>
  <line x1="0" y1="560" x2="430" y2="560" stroke="#C9C1B6" stroke-width="2"/>
  <line x1="680" y1="560" x2="1280" y2="560" stroke="#C5D0D6" stroke-width="2"/>

  <!-- Lap siding -->
  <g stroke="#C5D0D6" stroke-width="2">
    <line x1="680" y1="48" x2="1280" y2="48"/>
    <line x1="680" y1="96" x2="1280" y2="96"/>
    <line x1="680" y1="144" x2="1280" y2="144"/>
    <line x1="680" y1="192" x2="1280" y2="192"/>
    <line x1="680" y1="240" x2="1280" y2="240"/>
    <line x1="680" y1="468" x2="1280" y2="468"/>
    <line x1="680" y1="516" x2="1280" y2="516"/>
  </g>
  <!-- Studs -->
  <rect x="448" y="0" width="18" height="560" fill="#D9CFC3"/>
  <rect x="644" y="0" width="18" height="560" fill="#CDBFAF"/>
  <rect x="662" y="0" width="18" height="720" fill="#D5CBBF"/>

  <!-- Duct through the wall -->
  <path d="M250 292 H860 a28 28 0 0 1 28 28 v0 a28 28 0 0 1 -28 28 H250" fill="#D5DCE3" stroke="#5E6A75" stroke-width="2.5"/>
  <path d="M268 306 H848 a14 14 0 0 1 14 14 v0 a14 14 0 0 1 -14 14 H268" fill="#F4F8FA"/>
  <g stroke="#5E6A75" stroke-width="1.4" opacity="0.85">
    <line x1="300" y1="306" x2="300" y2="334"/>
    <line x1="324" y1="306" x2="324" y2="334"/>
    <line x1="348" y1="306" x2="348" y2="334"/>
    <line x1="372" y1="306" x2="372" y2="334"/>
  </g>
  <!-- Lint in the duct -->
  <path d="M500 328 H760 a6 6 0 0 1 0 12 H500 a6 6 0 0 1 0 -12" fill="#D7C4A2"/>
  <g fill="#8A6430" opacity="0.55">
    <circle cx="530" cy="334" r="2"/>
    <circle cx="570" cy="336" r="2.2"/>
    <circle cx="620" cy="333" r="1.8"/>
    <circle cx="670" cy="336" r="2"/>
    <circle cx="720" cy="334" r="1.8"/>
  </g>

  <!-- Hood body -->
  <path d="M820 268 h150 l36 28 v96 l-36 28 h-150 z" fill="#FBF9F6" stroke="#1F2A37" stroke-width="3"/>
  <path d="M836 292 h118 l22 18 v68 l-22 18 h-118 z" fill="#EEF3F6" stroke="#5E6A75" stroke-width="1.6"/>

  <!-- Flap outside the hood, propped open by a twig -->
  <g transform="rotate(-36 1006 308)">
    <rect x="998" y="308" width="16" height="102" rx="4" fill="#1F2A37"/>
  </g>
  <path d="M948 372 C990 358 1018 348 1044 356" fill="none" stroke="#8A6430" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Nest: twigs and grass in the mouth -->
  <g fill="none" stroke="#8A6430" stroke-width="3.2" stroke-linecap="round">
    <path d="M860 392 C890 360 930 372 968 348"/>
    <path d="M868 404 C900 378 940 390 990 362"/>
    <path d="M872 414 C910 400 948 408 1004 384"/>
    <path d="M858 400 C900 420 950 412 992 396"/>
    <path d="M880 386 C910 370 940 382 978 368"/>
  </g>
  <g fill="none" stroke="#6B8F71" stroke-width="2.4" stroke-linecap="round">
    <path d="M900 398 C906 372 912 360 908 346"/>
    <path d="M934 390 C942 366 948 352 940 340"/>
    <path d="M966 384 C974 362 980 350 972 338"/>
  </g>
  <g fill="#C4A574" stroke="#8A6430" stroke-width="1">
    <ellipse cx="930" cy="400" rx="22" ry="8"/>
    <ellipse cx="968" cy="392" rx="16" ry="6"/>
  </g>

  <!-- Mouse in the wall cavity, under the duct -->
  <g transform="translate(455 455)">
    <path d="M18 42 C0 48 -16 36 -36 42" fill="none" stroke="#5C6770" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="58" cy="40" rx="34" ry="16" fill="#5C6770"/>
    <ellipse cx="42" cy="46" rx="12" ry="8" fill="#4E5964"/>
    <ellipse cx="90" cy="30" rx="15" ry="12" fill="#5C6770"/>
    <circle cx="84" cy="16" r="7.5" fill="#5C6770"/>
    <circle cx="84" cy="16" r="3.6" fill="#C9B8A8"/>
    <circle cx="96" cy="28" r="1.8" fill="#FBF9F6"/>
    <circle cx="104" cy="32" r="2.1" fill="#1F2A37"/>
    <ellipse cx="48" cy="54" rx="9" ry="3.2" fill="#4E5964"/>
    <ellipse cx="74" cy="54" rx="8" ry="3.2" fill="#4E5964"/>
  </g>

  <!-- Number badges -->
  <g font-family="Inter, Liberation Sans, sans-serif" font-size="16" font-weight="700" fill="#FBF9F6">
    <circle cx="1110" cy="168" r="16" fill="#E8632B"/>
    <text x="1110" y="174" text-anchor="middle">1</text>
    <circle cx="930" cy="168" r="16" fill="#E8632B"/>
    <text x="930" y="174" text-anchor="middle">2</text>
    <circle cx="620" cy="168" r="16" fill="#E8632B"/>
    <text x="620" y="174" text-anchor="middle">3</text>
    <circle cx="520" cy="430" r="16" fill="#E8632B"/>
    <text x="520" y="436" text-anchor="middle">4</text>
  </g>
  <g font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">
    <text x="1110" y="214" text-anchor="middle">Flap held open</text>
    <text x="760" y="250">Twigs and grass</text>
    <text x="470" y="250">Lint in the duct</text>
    <text x="548" y="436">Mouse in the wall</text>
  </g>
  <path d="M1110 226 L1068 340" fill="none" stroke="#E8632B" stroke-width="1.6"/>
  <path d="M930 184 V300" fill="none" stroke="#E8632B" stroke-width="1.6"/>
  <path d="M620 184 V300" fill="none" stroke="#E8632B" stroke-width="1.6"/>

  <text x="200" y="250" font-family="Inter, Liberation Sans, sans-serif" font-size="18" font-weight="600" fill="#5C6770">From the dryer</text>

  <rect x="0" y="620" width="1280" height="100" fill="#F6F1EA"/>
  <text x="640" y="662" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">An open flap is a hole into the wall. Twigs in the mouth block the exhaust.</text>
  <text x="640" y="696" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="18" font-weight="500" fill="#5C6770">Look from the yard. Stay off the ladder and the roof.</text>
</svg>
