  <rect x="462" y="176" width="50" height="390" fill="#E6DDD2" stroke="#1F2A37" stroke-width="2.2"/>
  <line x1="462" y1="204" x2="512" y2="204" stroke="#D3CBBF" stroke-width="1.4"/>
  <line x1="462" y1="246" x2="512" y2="246" stroke="#D3CBBF" stroke-width="1.4"/>
  <line x1="462" y1="288" x2="512" y2="288" stroke="#D3CBBF" stroke-width="1.4"/>
  <line x1="462" y1="330" x2="512" y2="330" stroke="#D3CBBF" stroke-width="1.4"/>
  <line x1="462" y1="372" x2="512" y2="372" stroke="#D3CBBF" stroke-width="1.4"/>
  <line x1="462" y1="456" x2="512" y2="456" stroke="#D3CBBF" stroke-width="1.4"/>
  <line x1="462" y1="498" x2="512" y2="498" stroke="#D3CBBF" stroke-width="1.4"/>
  <line x1="462" y1="540" x2="512" y2="540" stroke="#D3CBBF" stroke-width="1.4"/>
  <rect x="456" y="368" width="62" height="48" fill="#D5DCE3" stroke="#5E6A75" stroke-width="2"/>

  <path d="M512,346 h62 l16,14 v52 l-16,14 h-62 z" fill="#FBF9F6" stroke="#1F2A37" stroke-width="2.5"/>
  <line x1="524" y1="364" x2="566" y2="358" stroke="#5E6A75" stroke-width="2.1" stroke-linecap="round"/>
  <line x1="524" y1="380" x2="566" y2="374" stroke="#5E6A75" stroke-width="2.1" stroke-linecap="round"/>
  <line x1="524" y1="396" x2="566" y2="390" stroke="#5E6A75" stroke-width="2.1" stroke-linecap="round"/>
  <g transform="rotate(-62 586 348)">
    <rect x="574" y="344" width="34" height="8" rx="2" fill="#1F2A37"/>
