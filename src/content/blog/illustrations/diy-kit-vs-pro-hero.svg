<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <rect width="1280" height="720" fill="#F6F1EA"/>

  <!-- Left: short run a kit can finish -->
  <rect x="32" y="28" width="596" height="664" fill="#FBF9F6" stroke="#C9C1B6" stroke-width="1.5"/>
  <rect x="32" y="28" width="596" height="8" fill="#E8632B"/>
  <text x="330" y="86" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="32" font-weight="600" fill="#1F2A37">Short side-wall run</text>
  <text x="330" y="122" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="500" fill="#5C6770">The brush reaches the hood</text>

  <rect x="478" y="36" width="150" height="520" fill="#EEF1F3"/>

  <rect x="72" y="210" width="156" height="268" rx="8" fill="#FBF9F6" stroke="#1F2A37" stroke-width="3"/>
  <rect x="72" y="210" width="156" height="44" rx="8" fill="#1F2A37"/>
  <rect x="72" y="240" width="156" height="14" fill="#1F2A37"/>
  <circle cx="202" cy="230" r="7.5" fill="#E8632B"/>
  <circle cx="180" cy="230" r="4.2" fill="#F6F1EA"/>
  <circle cx="164" cy="230" r="4.2" fill="#F6F1EA" opacity="0.7"/>
  <circle cx="150" cy="352" r="52" fill="#F3EFE8" stroke="#1F2A37" stroke-width="3"/>
  <circle cx="150" cy="352" r="43" fill="none" stroke="#C9C1B6" stroke-width="2"/>
  <circle cx="150" cy="352" r="13" fill="#FBF9F6" stroke="#5E6A75" stroke-width="2"/>
  <rect x="92" y="442" width="116" height="8" rx="2" fill="#C9C1B6"/>

  <circle cx="228" cy="392" r="16" fill="#1F2A37"/>
  <circle cx="228" cy="392" r="9" fill="#141A22"/>

  <rect x="220" y="368" width="268" height="48" rx="24" fill="#D5DCE3" stroke="#5E6A75" stroke-width="2.5"/>
  <rect x="244" y="378" width="220" height="28" rx="14" fill="#F4F8FA"/>
  <g stroke="#E8632B" stroke-width="4" stroke-linecap="round">
    <line x1="252" y1="392" x2="292" y2="392"/>
    <line x1="304" y1="392" x2="344" y2="392"/>
    <line x1="356" y1="392" x2="396" y2="392"/>
  </g>
  <circle cx="424" cy="392" r="11" fill="#E8632B"/>
  <g stroke="#E8632B" stroke-width="2.2" stroke-linecap="round">
    <line x1="424" y1="376" x2="424" y2="366"/>
    <line x1="436" y1="380" x2="444" y2="372"/>
    <line x1="438" y1="392" x2="450" y2="392"/>
    <line x1="436" y1="404" x2="444" y2="412"/>
    <line x1="424" y1="408" x2="424" y2="418"/>
    <line x1="412" y1="404" x2="404" y2="412"/>
    <line x1="410" y1="392" x2="398" y2="392"/>
