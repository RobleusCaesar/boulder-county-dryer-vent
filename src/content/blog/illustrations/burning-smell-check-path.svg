<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <title>Places to check when a dryer smells like something is burning</title>
  <rect width="1280" height="720" fill="#F6F1EA"/>
  <rect x="900" y="0" width="380" height="720" fill="#EEF1F3"/>
  <rect x="740" y="0" width="160" height="720" fill="#E6DDD2"/>
  <g stroke="#D3CBBF" stroke-width="1.5">
    <line x1="740" y1="48" x2="900" y2="48"/>
    <line x1="740" y1="112" x2="900" y2="112"/>
    <line x1="740" y1="176" x2="900" y2="176"/>
    <line x1="740" y1="240" x2="900" y2="240"/>
    <line x1="740" y1="304" x2="900" y2="304"/>
    <line x1="740" y1="496" x2="900" y2="496"/>
    <line x1="740" y1="560" x2="900" y2="560"/>
    <line x1="740" y1="624" x2="900" y2="624"/>
    <line x1="740" y1="688" x2="900" y2="688"/>
  </g>
  <line x1="40" y1="568" x2="1240" y2="568" stroke="#C9C1B6" stroke-width="2"/>

  <!-- Dryer -->
  <rect x="56" y="188" width="210" height="360" rx="8" fill="#FBF9F6" stroke="#1F2A37" stroke-width="3"/>
  <rect x="56" y="188" width="210" height="48" rx="8" fill="#1F2A37"/>
  <rect x="56" y="220" width="210" height="16" fill="#1F2A37"/>
  <circle cx="236" cy="212" r="8" fill="#E8632B"/>
  <circle cx="210" cy="212" r="4.5" fill="#F6F1EA"/>
  <circle cx="192" cy="212" r="4.5" fill="#F6F1EA" opacity="0.7"/>
  <circle cx="161" cy="372" r="74" fill="#F3EFE8" stroke="#1F2A37" stroke-width="3"/>
  <circle cx="161" cy="372" r="60" fill="none" stroke="#C9C1B6" stroke-width="2"/>
  <circle cx="161" cy="372" r="16" fill="#FBF9F6" stroke="#5E6A75" stroke-width="2"/>
  <!-- Heating element with lint on it, visible in the lower drum -->
  <path d="M118 414 h14 l6 -12 h10 l6 12 h10 l6 -12 h10 l6 12 h12" fill="none" stroke="#E8632B" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="168" cy="428" rx="22" ry="9" fill="#C4A574" stroke="#8A6430" stroke-width="1.2"/>
  <ellipse cx="148" cy="422" rx="12" ry="6" fill="#D7C4A2" stroke="#8A6430" stroke-width="1"/>
  <rect x="86" y="496" width="150" height="8" rx="2" fill="#C9C1B6"/>

  <!-- Exhaust port -->
  <circle cx="266" cy="372" r="18" fill="#1F2A37"/>
  <circle cx="266" cy="372" r="10" fill="#141A22"/>

  <!-- Duct shell -->
  <path d="M278 346 H1036 a26 26 0 0 1 26 26 v0 a26 26 0 0 1 -26 26 H278" fill="#D5DCE3" stroke="#5E6A75" stroke-width="2.5"/>
  <path d="M292 358 H1024 a14 14 0 0 1 14 14 v0 a14 14 0 0 1 -14 14 H292" fill="#F4F8FA"/>

  <!-- Transition ribs, stopping before the pinch -->
  <g stroke="#5E6A75" stroke-width="1.5" opacity="0.9">
    <line x1="330" y1="358" x2="330" y2="386"/>
    <line x1="350" y1="358" x2="350" y2="386"/>
    <line x1="370" y1="358" x2="370" y2="386"/>
    <line x1="390" y1="358" x2="390" y2="386"/>
    <line x1="410" y1="360" x2="410" y2="384"/>
    <line x1="560" y1="360" x2="560" y2="384"/>
    <line x1="580" y1="358" x2="580" y2="386"/>
    <line x1="600" y1="358" x2="600" y2="386"/>
    <line x1="620" y1="358" x2="620" y2="386"/>
    <line x1="640" y1="358" x2="640" y2="386"/>
  </g>

  <!-- Crushed pinch in the transition duct -->
  <path d="M430 358 C460 358 470 370 500 370 C530 370 540 358 570 358 L570 386 C540 386 530 374 500 374 C470 374 460 386 430 386 Z" fill="#C5CED6" stroke="#5E6A75" stroke-width="1.4"/>
  <g fill="#C4A574" stroke="#8A6430" stroke-width="0.8">
    <ellipse cx="492" cy="372" rx="14" ry="5"/>
    <ellipse cx="510" cy="370" rx="8" ry="3.5"/>
  </g>

  <!-- Lint coating in the wall run -->
  <path d="M760 370 H980 a6 6 0 0 1 0 12 H760 a6 6 0 0 1 0 -12" fill="#D7C4A2"/>
  <g fill="#8A6430" opacity="0.55">
    <circle cx="790" cy="376" r="2"/>
    <circle cx="830" cy="378" r="2.2"/>
    <circle cx="870" cy="375" r="1.8"/>
    <circle cx="910" cy="378" r="2"/>
    <circle cx="948" cy="376" r="1.8"/>
  </g>

  <!-- Airflow that stalls at the pinch and at the hood -->
  <g fill="none" stroke="#E8632B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 344 H340"/>
    <path d="M328 337 L342 344 L328 351"/>
  </g>

  <!-- Exterior hood with the flap stuck shut -->
  <path d="M1048 322 h92 l24 22 v72 l-24 22 h-92 z" fill="#FBF9F6" stroke="#1F2A37" stroke-width="2.6"/>
  <line x1="1066" y1="352" x2="1134" y2="346" stroke="#5E6A75" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="1066" y1="374" x2="1134" y2="368" stroke="#5E6A75" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="1066" y1="396" x2="1134" y2="390" stroke="#5E6A75" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="1066" y1="418" x2="1134" y2="412" stroke="#5E6A75" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Flap hanging closed over the outlet -->
  <rect x="1148" y="338" width="14" height="78" rx="3" fill="#1F2A37"/>
  <g fill="#C4A574" stroke="#8A6430" stroke-width="1">
    <ellipse cx="1104" cy="424" rx="18" ry="8"/>
    <ellipse cx="1126" cy="416" rx="12" ry="6"/>
    <ellipse cx="1084" cy="414" rx="8" ry="5"/>
  </g>

  <!-- Number badges -->
  <g font-family="Inter, Liberation Sans, sans-serif" font-size="18" font-weight="700" fill="#FBF9F6">
    <circle cx="161" cy="150" r="16" fill="#E8632B"/>
    <text x="161" y="156" text-anchor="middle">1</text>
    <circle cx="490" cy="150" r="16" fill="#E8632B"/>
    <text x="490" y="156" text-anchor="middle">2</text>
    <circle cx="820" cy="150" r="16" fill="#E8632B"/>
    <text x="820" y="156" text-anchor="middle">3</text>
    <circle cx="1120" cy="150" r="16" fill="#E8632B"/>
    <text x="1120" y="156" text-anchor="middle">4</text>
  </g>
  <g font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37" text-anchor="middle">
    <text x="161" y="124">Lint on the heater</text>
    <text x="490" y="124">Crushed transition</text>
    <text x="820" y="124">Lint in the wall run</text>
    <text x="1120" y="124">Stuck hood flap</text>
  </g>

  <rect x="0" y="592" width="1280" height="128" fill="#F6F1EA"/>
  <text x="640" y="648" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">Heat has to leave the house. Lint or a pinch anywhere on this path holds it in the dryer.</text>
  <text x="640" y="684" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="18" font-weight="500" fill="#5C6770">Check a ground-level hood from the yard. Stay off the ladder and the roof.</text>
</svg>
