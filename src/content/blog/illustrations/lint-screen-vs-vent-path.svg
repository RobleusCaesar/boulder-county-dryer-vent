<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <title>Lint path from the dryer screen to the exterior hood</title>
  <rect width="1280" height="720" fill="#F6F1EA"/>
  <rect x="920" y="0" width="360" height="720" fill="#EEF1F3"/>
  <rect x="760" y="0" width="160" height="720" fill="#E6DDD2"/>
  <line x1="760" y1="48" x2="920" y2="48" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="112" x2="920" y2="112" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="176" x2="920" y2="176" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="240" x2="920" y2="240" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="304" x2="920" y2="304" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="432" x2="920" y2="432" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="496" x2="920" y2="496" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="560" x2="920" y2="560" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="624" x2="920" y2="624" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="760" y1="688" x2="920" y2="688" stroke="#D3CBBF" stroke-width="1.5"/>
  <line x1="48" y1="568" x2="1232" y2="568" stroke="#C9C1B6" stroke-width="2"/>

  <!-- Dryer -->
  <rect x="64" y="214" width="214" height="354" rx="8" fill="#FBF9F6" stroke="#1F2A37" stroke-width="3"/>
  <rect x="64" y="214" width="214" height="50" rx="8" fill="#1F2A37"/>
  <rect x="64" y="248" width="214" height="16" fill="#1F2A37"/>
  <circle cx="248" cy="238" r="8" fill="#E8632B"/>
  <circle cx="222" cy="238" r="4.5" fill="#F6F1EA"/>
  <circle cx="204" cy="238" r="4.5" fill="#F6F1EA" opacity="0.7"/>
  <circle cx="171" cy="392" r="78" fill="#F3EFE8" stroke="#1F2A37" stroke-width="3"/>
  <circle cx="171" cy="392" r="64" fill="none" stroke="#C9C1B6" stroke-width="2"/>
  <circle cx="171" cy="392" r="18" fill="#FBF9F6" stroke="#5E6A75" stroke-width="2"/>
  <rect x="92" y="508" width="158" height="8" rx="2" fill="#C9C1B6"/>

  <!-- Lint screen pulled from the top -->
  <rect x="118" y="202" width="108" height="16" rx="2" fill="#141A22"/>
  <rect x="132" y="78" width="80" height="128" rx="4" fill="#FBF9F6" stroke="#1F2A37" stroke-width="2.5"/>
  <rect x="150" y="64" width="44" height="16" rx="4" fill="#1F2A37"/>
  <g stroke="#5E6A75" stroke-width="1.3">
    <line x1="144" y1="96" x2="200" y2="96"/>
    <line x1="144" y1="112" x2="200" y2="112"/>
    <line x1="144" y1="128" x2="200" y2="128"/>
    <line x1="144" y1="144" x2="200" y2="144"/>
    <line x1="144" y1="160" x2="200" y2="160"/>
    <line x1="144" y1="176" x2="200" y2="176"/>
    <line x1="144" y1="192" x2="200" y2="192"/>
    <line x1="152" y1="88" x2="152" y2="198"/>
    <line x1="168" y1="88" x2="168" y2="198"/>
    <line x1="184" y1="88" x2="184" y2="198"/>
  </g>
  <ellipse cx="158" cy="118" rx="16" ry="11" fill="#C4A574" stroke="#8A6430" stroke-width="1.4"/>
  <ellipse cx="178" cy="132" rx="18" ry="12" fill="#D7C4A2" stroke="#8A6430" stroke-width="1.4"/>
  <ellipse cx="164" cy="146" rx="14" ry="9" fill="#B08958" stroke="#8A6430" stroke-width="1.2"/>
  <ellipse cx="186" cy="156" rx="11" ry="8" fill="#C4A574" stroke="#8A6430" stroke-width="1.2"/>
  <text x="172" y="48" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">Lint screen</text>

  <!-- Exhaust port -->
  <circle cx="278" cy="400" r="20" fill="#1F2A37"/>
  <circle cx="278" cy="400" r="11" fill="#141A22"/>

  <!-- Duct outer shell -->
  <path d="M286 372 H1004 a28 28 0 0 1 28 28 v0 a28 28 0 0 1 -28 28 H286" fill="#D5DCE3" stroke="#5E6A75" stroke-width="2.5"/>
  <path d="M300 384 H992 a16 16 0 0 1 16 16 v0 a16 16 0 0 1 -16 16 H300" fill="#F4F8FA"/>

  <!-- Transition ribs -->
  <g stroke="#5E6A75" stroke-width="1.6" opacity="0.85">
    <line x1="430" y1="384" x2="430" y2="416"/>
    <line x1="452" y1="384" x2="452" y2="416"/>
    <line x1="474" y1="384" x2="474" y2="416"/>
    <line x1="496" y1="384" x2="496" y2="416"/>
    <line x1="518" y1="384" x2="518" y2="416"/>
    <line x1="540" y1="384" x2="540" y2="416"/>
    <line x1="562" y1="384" x2="562" y2="416"/>
    <line x1="584" y1="384" x2="584" y2="416"/>
    <line x1="606" y1="384" x2="606" y2="416"/>
  </g>

  <!-- Fine lint in the duct: specks, then a light coating in the wall run -->
  <g fill="#C4A574">
    <circle cx="348" cy="406" r="3.2"/>
    <circle cx="378" cy="398" r="2.4"/>
    <circle cx="402" cy="410" r="2.8"/>
    <circle cx="444" cy="408" r="3"/>
    <circle cx="468" cy="404" r="2.2"/>
    <circle cx="492" cy="410" r="3.2"/>
    <circle cx="516" cy="406" r="2.4"/>
    <circle cx="544" cy="409" r="3"/>
    <circle cx="572" cy="404" r="2.2"/>
    <circle cx="598" cy="410" r="2.8"/>
  </g>
  <path d="M640 408 H980 a8 8 0 0 1 0 16 H640 a8 8 0 0 1 0 -16" fill="#D7C4A2" opacity="0.95"/>
  <g fill="#8A6430" opacity="0.55">
    <circle cx="670" cy="414" r="2.2"/>
    <circle cx="710" cy="416" r="2.6"/>
    <circle cx="756" cy="413" r="2"/>
    <circle cx="804" cy="417" r="2.4"/>
    <circle cx="848" cy="414" r="2.2"/>
    <circle cx="896" cy="416" r="2.6"/>
    <circle cx="940" cy="413" r="2"/>
  </g>

  <!-- Airflow arrows, kept above the lint coating -->
  <g fill="none" stroke="#E8632B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 392 H352"/>
    <path d="M344 385 L356 392 L344 399"/>
    <path d="M630 392 H664"/>
    <path d="M656 385 L668 392 L656 399"/>
    <path d="M900 392 H934"/>
    <path d="M926 385 L938 392 L926 399"/>
  </g>

  <!-- Lint on the floor behind the dryer -->
  <g fill="#C4A574" stroke="#8A6430" stroke-width="1">
    <ellipse cx="312" cy="548" rx="14" ry="7"/>
    <ellipse cx="336" cy="542" rx="10" ry="6"/>
    <ellipse cx="354" cy="552" rx="8" ry="5"/>
  </g>

  <!-- Exterior hood -->
  <path d="M1016 348 h86 l22 20 v64 l-22 20 h-86 z" fill="#FBF9F6" stroke="#1F2A37" stroke-width="2.6"/>
  <line x1="1034" y1="372" x2="1096" y2="364" stroke="#5E6A75" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="1034" y1="392" x2="1096" y2="384" stroke="#5E6A75" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="1034" y1="412" x2="1096" y2="404" stroke="#5E6A75" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="1034" y1="432" x2="1096" y2="424" stroke="#5E6A75" stroke-width="2.2" stroke-linecap="round"/>
  <g transform="rotate(-62 1118 360)">
    <rect x="1112" y="354" width="40" height="9" rx="2" fill="#1F2A37"/>
  </g>
  <g fill="#C4A574" stroke="#8A6430" stroke-width="1">
    <ellipse cx="1064" cy="436" rx="16" ry="8"/>
    <ellipse cx="1088" cy="430" rx="11" ry="6"/>
  </g>
  <g fill="none" stroke="#E8632B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1136 400 H1172"/>
    <path d="M1160 392 L1174 400 L1160 408"/>
  </g>

  <text x="360" y="332" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">Behind the</text>
  <text x="360" y="358" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">dryer</text>
  <text x="518" y="470" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">Transition duct</text>
  <text x="840" y="348" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">Wall run</text>
  <text x="1110" y="500" text-anchor="middle" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">Exterior hood</text>

  <!-- Legend sits on a clear band so the wall joints do not cut the type -->
  <rect x="0" y="592" width="1280" height="128" fill="#F6F1EA"/>
  <ellipse cx="250" cy="640" rx="18" ry="11" fill="#C4A574" stroke="#8A6430" stroke-width="1.5"/>
  <text x="280" y="647" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">Clumps stay on the screen</text>
  <g fill="#C4A574">
    <circle cx="760" cy="640" r="4"/>
    <circle cx="776" cy="640" r="3"/>
    <circle cx="790" cy="640" r="4.5"/>
  </g>
  <text x="808" y="647" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="600" fill="#1F2A37">Fine lint settles along the run</text>
</svg>
